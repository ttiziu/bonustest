<header class="topbar">
  <span class="brand">Recursos Humanos · Back office</span>
</header>

<main class="content">
@if (notification.pageMessage(); as message) {
  <div [class]="'notification notification-' + message.type" role="alert">
    <span>{{ message.text }}</span>
    <button type="button" class="notification-close" aria-label="Cerrar" (click)="notification.clear()">×</button>
  </div>
}

  <router-outlet />
</main>
